<!doctype html>

<style>
/* Tableau d'affichage sombre (un seul thème, voulu pour un écran projeté) :
   lignes d'équipes pleine largeur dont le remplissage coloré mesure l'écart au leader. */
:root{
  --fond:#0d1524; --surface:#151f35; --surface-2:#1c2843; --ligne:#2a3858;
  --texte:#eef1f7; --doux:#97a3bf; --or:#f3bf4f; --ok:#4fd18b; --alerte:#ff7a6b; --attente:#f0a83a;

  --f-texte:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;

}
*{box-sizing:border-box}
html,body,#app{height:100%}
body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.45 var(--f-texte);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.etiquette{font:600 .75rem/1 var(--f-texte);letter-spacing:.12em;text-transform:uppercase;color:var(--doux)}
.point{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--doux);vertical-align:.05em;margin-right:.45em}
.point.ok{background:var(--ok)} .point.ko{background:var(--alerte)} .point.att{background:var(--attente)}
.bouton{border:1px solid var(--ligne);background:var(--surface-2);border-radius:10px;padding:.7em 1.1em;font-weight:600}
.bouton:hover{border-color:var(--doux)}
.bouton.principal{background:var(--or);border-color:var(--or);color:#1a1405}
.bouton.danger{border-color:color-mix(in srgb,var(--alerte) 60%,transparent);color:var(--alerte)}
.champ{width:100%;background:var(--fond);border:1px solid var(--ligne);border-radius:10px;padding:.7em .85em}
.champ:focus{border-color:var(--or);outline:none}

/* ---------- Accueil ---------- */
.accueil{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.ecran-tete h1{font:800 clamp(1.8rem,5.2vh,4.2rem)/.95 var(--f-titre);margin:0;text-transform:uppercase;letter-spacing:.01em;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.ecran-etat{display:flex;align-items:center;gap:1.4vw;color:var(--doux);font-size:clamp(.8rem,1.7vh,1.1rem)}
.ecran-etat .bouton{padding:.45em .8em;font-size:inherit}
.ecran-corps{flex:1;min-height:0;display:flex;gap:2vw}
.liste{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--ecart,10px);position:relative}
.equipe{position:relative;height:var(--h,80px);flex:0 0 auto;border-radius:12px;background:var(--surface);overflow:hidden;
  display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:center;gap:.6em;padding:0 .7em;font-size:clamp(12px,calc(var(--h,80px) * .4),64px)}
/* Bannière entièrement à la couleur de l'équipe ; --t = texte lisible (clair ou foncé) calculé en JS */
.equipe{background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 82%,#000));color:var(--t,#fff);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.equipe .rang{font:800 1.15em/1 var(--f-titre);color:var(--t,#fff);opacity:.75;text-align:center}
.equipe .rang sup{font-size:.5em;vertical-align:.7em;margin-left:.05em}
.equipe .nom{font:700 .9em/1.05 var(--f-texte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.equipe .score{font:800 1.5em/1 var(--f-titre);font-variant-numeric:tabular-nums;text-align:right;min-width:2ch}
.equipe.tete{outline:3px solid var(--or);outline-offset:-3px}

.envol{position:absolute;right:3.2em;top:50%;font:800 .9em/1 var(--f-titre);pointer-events:none;animation:envol 1.6s ease-out forwards;font-variant-numeric:tabular-nums}
.envol{color:var(--t,#fff)}
@keyframes envol{0%{opacity:0;transform:translateY(-30%) scale(.7)}15%{opacity:1;transform:translateY(-50%) scale(1.1)}100%{opacity:0;transform:translateY(-160%) scale(1)}}
.vide{flex:1;display:grid;place-items:center;text-align:center;color:var(--doux);font-size:clamp(1rem,2.6vh,1.6rem);border:2px dashed var(--ligne);border-radius:16px;padding:4vh 2vw}
.vide strong{display:block;color:var(--texte);font:700 1.6em/1.1 var(--f-titre);text-transform:uppercase;margin-bottom:.4em}
.cote{width:clamp(150px,17vw,260px);display:flex;flex-direction:column;gap:2vh;min-height:0}
.qr-carte{background:var(--surface);border:1px solid var(--ligne);border-radius:14px;padding:1.6vh;display:grid;gap:1vh;justify-items:center;text-align:center}
.qr{background:#fff;padding:8px;border-radius:8px;line-height:0;width:100%;max-width:200px}

.code{font:700 clamp(.85rem,1.8vh,1.15rem)/1.2 var(--f-titre);letter-spacing:.06em;color:var(--texte);word-break:break-all}
.fil{display:grid;gap:.8vh;font-size:clamp(.8rem,1.8vh,1.1rem);overflow:hidden}
.fil li{display:flex;gap:.5em;align-items:baseline;list-style:none}

.fil .heure{color:var(--doux);margin-left:auto;font-size:.85em}

/* ---------- Télécommande ---------- */
.tele{max-width:560px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.tele-tete{display:grid;gap:4px}
.tele-tete h1{font:800 1.9rem/1 var(--f-titre);text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.statut{font-size:.9rem;color:var(--doux)}
.onglets{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--ligne);border-radius:12px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.onglets button{border:0;background:none;border-radius:9px;padding:.6em;font-weight:600;color:var(--doux)}
.onglets button[aria-selected="true"]{background:var(--surface-2);color:var(--texte)}
.cartes{display:grid;gap:12px}
.carte{background:var(--surface);border:1px solid var(--ligne);border-radius:14px;padding:12px;display:grid;gap:10px}
.carte-haut{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.pastille{width:14px;height:14px;border-radius:50%;background:var(--c)}
.carte .nom{font-weight:700;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carte .rangc{color:var(--doux);font-size:.85rem;font-weight:500}
.carte .score{font:800 2rem/1 var(--f-titre);font-variant-numeric:tabular-nums}
.carte .score.envoi{color:var(--attente)}
.touches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.touches button{border:1px solid var(--ligne);background:var(--surface-2);border-radius:10px;padding:.75em 0;font:700 1.05rem/1 var(--f-titre);touch-action:manipulation}
.touches button:active{transform:scale(.95);background:var(--ligne)}
.touches .moins{color:var(--alerte)}
.touches .plus{color:var(--ok)}
.lecture .touches,.lecture .histo button,.lecture .carte>.bouton{display:none}
/* Carte d'équipe remplie de sa couleur ; --t = texte lisible (clair ou foncé) */
.carte-equipe{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 82%,#000));border-color:transparent;color:var(--t,#fff);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.carte-equipe .carte-haut{grid-template-columns:minmax(0,1fr) auto}
.carte-equipe .pastille{display:none}
.carte-equipe .rangc{color:var(--t,#fff);opacity:.75}
.carte-equipe .score.envoi{color:var(--t,#fff);opacity:.6}
.carte-equipe .touches button{background:color-mix(in srgb,var(--t,#fff) 14%,transparent);border-color:color-mix(in srgb,var(--t,#fff) 30%,transparent);color:var(--t,#fff)}
.carte-equipe .touches button:active{background:color-mix(in srgb,var(--t,#fff) 28%,transparent)}
.section-titre{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.histo{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.histo li{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border-radius:10px;font-size:.95rem}
.histo .qui{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.histo .delta{font:700 1.05rem/1 var(--f-titre);min-width:3.2ch;text-align:right}
.histo .annule{opacity:.5;text-decoration:line-through}
.histo button{border:1px solid var(--ligne);background:none;border-radius:8px;padding:.3em .6em;font-size:.85rem;color:var(--doux)}
.reglage{display:grid;gap:10px}
.equipe-edit{display:grid;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--ligne);border-radius:12px}
.equipe-edit .ligne1{display:flex;gap:8px}
.equipe-edit .ligne1 .champ{flex:1;min-width:0}
.couleurs{display:flex;flex-wrap:wrap;gap:8px}
.couleurs button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.couleurs button[aria-pressed="true"]{border-color:var(--texte);box-shadow:0 0 0 2px var(--fond) inset}
.hex-zone{display:inline-flex;gap:8px;align-items:center}
.nuancier{width:34px;height:34px;padding:0;border:1px solid var(--ligne);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
.nuancier::-webkit-color-swatch-wrapper{padding:0}.nuancier::-webkit-color-swatch{border:0;border-radius:50%}
.champ.hex{width:7.5em;padding:.45em .6em;font-variant-numeric:tabular-nums;text-transform:uppercase}
.champ.hex.actif{border-color:var(--texte)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.95rem}
.sauvegardes{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.sauvegarde{display:grid;gap:4px;padding:10px;background:var(--fond);border:1px solid var(--ligne);border-radius:10px}
.sauvegarde-haut{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sauvegarde-haut .bouton{padding:.4em .8em;font-size:.9rem;flex:0 0 auto}
.sauvegarde .resume{overflow-wrap:anywhere}
.note{color:var(--doux);font-size:.9rem;margin:0}
.lien{word-break:break-all;font-size:.85rem;color:var(--doux);background:var(--fond);padding:8px;border-radius:8px;border:1px solid var(--ligne);user-select:all}

.feuille-fond{position:fixed;inset:0;background:rgba(5,9,18,.7);display:grid;align-items:end;z-index:20}
.feuille{background:var(--surface);border-top:1px solid var(--ligne);border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:12px;max-width:560px;width:100%;margin:0 auto}
.feuille h2{margin:0;font:700 1.4rem/1.1 var(--f-titre);text-transform:uppercase}
.feuille .champ{font:800 2rem/1 var(--f-titre);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--ligne);padding:.7em 1em;border-radius:10px;z-index:30;max-width:calc(100% - 32px);font-size:.95rem}
@media (prefers-reduced-motion:reduce){.envol{animation-duration:.01s}}
</style>

<script>
"use strict";
/* ============================================================
   ADRESSE DE TA BASE FIREBASE (Realtime Database), voir LISEZMOI.md.
   Exemple : "https://mon-classement-default-rtdb.europe-west1.firebasedatabase.app"
   Laisse vide pour la saisir dans la page d'accueil.
   ============================================================ */
const BASE_FIREBASE = "https://scoring-concours-de-bravoure-default-rtdb.europe-west1.firebasedatabase.app/";
/* CLÉ API WEB du projet Firebase (Paramètres du projet → Général → « Clé API Web »).
   Elle sert à la connexion des personnes autorisées à modifier les scores.
   Ce n'est pas un secret : la protection vient des règles de la base. */
const CLE_API_FIREBASE = "AIzaSyCOWfNXn6LA76RJZ1OPGfT-qJynTFhakKI";
/* ADRESSE DU COMPTE ARBITRE créé dans Firebase Authentication (voir LISEZMOI.md).
   Quand elle est renseignée, la télécommande ne demande que le mot de passe arbitre. */
const EMAIL_ARBITRE = "arbitre@concours-bravoure.app";
/* ADRESSE DU COMPTE ADMIN (second compte Firebase Authentication).
   Son mot de passe est demandé à chaque remise à zéro des scores. */
const EMAIL_ADMIN = "admin@concours-bravoure.app";

/* Les scores vivent dans la base, sous /salles/<code>. Les ajouts de points
   sont des incréments atomiques côté serveur : plusieurs téléphones peuvent
   marquer en même temps, et l'écran n'a pas besoin d'être ouvert. */
const PALETTE = ["#ff5d5d","#ff9f3a","#f4d03f","#5fd17a","#2ec4b6","#4ea8ff","#7b6cff","#d46cff","#ff6fb1","#c3c9d6"];
const NOMS_COULEURS = ["Rouge","Orange","Jaune","Vert","Turquoise","Bleu","Indigo","Violet","Rose","Gris"];
const MAX_EQUIPES = 16, GARDER_HIST = 30;

const $ = (s, r = document) => r.querySelector(s);
function el(tag, props = {}, ...enfants) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v;
    else e.setAttribute(k, v);
  }
  for (const c of enfants) if (c != null) e.append(c);
  return e;
}
function stock(cle, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(cle));
    localStorage.setItem(cle, JSON.stringify(val));
  } catch { return null; }
}
function aleatoire(n = 8) {
  const a = "abcdefghjkmnpqrstuvwxyz23456789";
  return [...crypto.getRandomValues(new Uint8Array(n))].map(x => a[x % a.length]).join("");
}
const normCode = c => String(c || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const joliCode = c => normCode(c).match(/.{1,4}/g)?.join("-") || "";
const ordinal = n => n === 1 ? ["1", "er"] : [String(n), "e"];
const signe = d => (d > 0 ? "+" : "−") + Math.abs(d);
const heure = ts => new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const cleTemps = () => Date.now().toString(36).padStart(9, "0") + aleatoire(4); // triable par date
const inc = d => ({ ".sv": { increment: d } });
let toastMinuteur;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastMinuteur); toastMinuteur = setTimeout(() => t.hidden = true, 3500);
}
const estId = v => typeof v === "string" && /^[a-z0-9]{1,16}$/.test(v);
// Couleur d'équipe : indice de la palette (0 à 9) ou code HEX « #RRGGBB »
const estHex = v => typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v);
const estCouleur = v => (Number.isInteger(v) && v >= 0 && v < PALETTE.length) || estHex(v);
const couleur = co => estHex(co) ? co : PALETTE[co] || PALETTE[9];
// Texte le plus lisible (blanc ou bleu nuit) sur une couleur de fond, d'après le contraste WCAG
function texteSur(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lin((n >> 16) & 255) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
  return 1.05 / (L + 0.05) >= (L + 0.05) / 0.0584 ? "#ffffff" : "#0d1524";
}
const nomCouleur = co => estHex(co) ? co.toUpperCase() : NOMS_COULEURS[co] || "";
function lireHex(v) {
  let s = String(v || "").trim().replace(/^#?/, "#");
  if (/^#[0-9a-fA-F]{3}$/.test(s)) s = "#" + [...s.slice(1)].map(c => c + c).join("");
  return estHex(s) ? s.toLowerCase() : null;
}
const texte = (v, max) => typeof v === "string" ? v.trim().slice(0, max) : "";

/* ---------- Adresse de la base ---------- */
const params = new URLSearchParams(location.search);
function baseValide(b) {
  try {
    const u = new URL(String(b || ""));
    if (u.protocol === "https:" && /\.(firebaseio\.com|firebasedatabase\.app)$/.test(u.hostname)) return u.origin;
    if (location.hostname === "localhost" && u.hostname === "localhost") return u.origin; // tests locaux
  } catch {}
  return null;
}
const BASE_FIXE = baseValide(BASE_FIREBASE);
const BASE = BASE_FIXE || baseValide(params.get("base")) || baseValide(stock("base"));
if (BASE && !BASE_FIXE) stock("base", BASE);
const cleValide = c => /^[A-Za-z0-9_-]{20,60}$/.test(String(c || "")) ? String(c) : null;
const CLE_FIXE = cleValide(CLE_API_FIREBASE);
const CLE = CLE_FIXE || cleValide(params.get("cle")) || cleValide(stock("cle"));
if (CLE && !CLE_FIXE) stock("cle", CLE);
function urlVue(code, vue) {
  const u = new URL(location.href);
  u.search = ""; u.hash = "";
  u.searchParams.set("salle", joliCode(code));
  u.searchParams.set("vue", vue);
  if (!BASE_FIXE && BASE) u.searchParams.set("base", BASE);
  if (!CLE_FIXE && CLE) u.searchParams.set("cle", CLE);
  return u.toString();
}

/* ---------- Connexion des personnes autorisées (Firebase Authentication, e-mail + mot de passe) ---------- */
const testLocal = () => location.hostname === "localhost" && String(BASE).startsWith("http://localhost");
const urlAuth = quoi => testLocal() ? `${BASE}/__auth/${quoi}`
  : quoi === "connexion" ? `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(CLE)}`
  : `https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(CLE)}`;
const cleSession = () => "session:" + BASE;
const session = () => stock(cleSession());
function deconnecter() { try { localStorage.removeItem(cleSession()); } catch {} }
async function authentifier(email, motDePasse) {
  if (!CLE && !testLocal()) throw new Error("CLE_MANQUANTE");
  let r;
  try {
    r = await fetch(urlAuth("connexion"), { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password: motDePasse, returnSecureToken: true }) });
  } catch { throw new Error("RESEAU"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j?.error?.message || "ERREUR");
  return j;
}
async function connecter(email, motDePasse) {
  const j = await authentifier(email, motDePasse);
  stock(cleSession(), { uid: j.localId, email: j.email, jeton: j.idToken, renouv: j.refreshToken, exp: Date.now() + Number(j.expiresIn || 3600) * 1000 });
}
async function jeton() {
  const s = session();
  if (!s) return null;
  if (s.exp - 120000 > Date.now()) return s.jeton;
  try {
    const r = await fetch(urlAuth("jeton"), { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(s.renouv) });

function creerSalle(code, surChange, surConnexion) {

    source.addEventListener("put", e => { const m = lire(e); if (!m) return; surConnexion("ok"); poser(m.path, m.data); notifier(true); });
    source.addEventListener("patch", e => {
      const m = lire(e); if (!m || !m.data) return;
      const p = String(m.path).replace(/\/+$/, "");
      for (const [k, v] of Object.entries(m.data)) poser(p + "/" + k, v);
      notifier(true);

  }

  async function modifier(maj, optimiste, jetonPonctuel) {
    if (optimiste) { for (const [k, v] of Object.entries(optimiste)) poser(k, v); notifier(false); }
    let r;
    const t = jetonPonctuel || await jeton();
    try { r = await fetch(racine + ".json" + (t ? "?auth=" + encodeURIComponent(t) : ""), { method: "PATCH", body: JSON.stringify(maj) }); }
    catch { recharger(); throw Object.assign(new Error("réseau"), { status: 0 }); }
    if (!r.ok) { recharger(); throw Object.assign(new Error("base " + r.status), { status: r.status }); }
  }

}

  function majMode() {
    admin = !!session();
    racineTele.classList.toggle("lecture", !admin);
    formConnexion.hidden = admin; nav.hidden = !admin;
    if (!admin && onglet !== "points") { choisir("points"); return; }
    signatureReglages = "";
    rendre();
  }

  function rendreStatut() {
    let cls, txt;
    if (connexion === "refus") { cls = "ko"; txt = "Accès refusé : vérifie les règles Firebase"; }
    else if (connexion === "attente") { cls = "att"; txt = "Connexion…"; }
    else if (connexion !== "ok") { cls = "ko"; txt = "Hors ligne : reconnexion…"; }
    else if (!admin) { cls = "att"; txt = "Scores en direct · lecture seule"; }
    else if (etat.ecran && Math.abs(Date.now() - etat.ecran) < 90000) { cls = "ok"; txt = "Connecté · écran ouvert"; }
    else { cls = "att"; txt = "Connecté · écran fermé (les points sont quand même enregistrés)"; }
    statut.replaceChildren(el("span", { class: "point " + cls }), txt);
  }
  function rendre() {
    etat = lireEtat(salle.arbre);
    h1.textContent = etat.titre;
    document.title = "Télécommande · " + etat.titre;
    const rangs = new Map(classer(etat.equipes).map(x => [x.id, x.rang]));
    videPoints.hidden = etat.equipes.length > 0;
    for (const [id, c] of cartes) if (!etat.equipes.some(x => x.id === id)) { c.remove(); cartes.delete(id); }
    for (const x of etat.equipes) {
      let c = cartes.get(x.id);
      if (!c) {
        const touche = (d, cls) => el("button", { class: cls, text: signe(d), "aria-label": `${signe(d)} point${Math.abs(d) > 1 ? "s" : ""}`, onclick: () => taper(x.id, d) });
        c = el("article", { class: "carte carte-equipe" },
          el("div", { class: "carte-haut" }, el("span", { class: "pastille" }),
            el("div", { style: "min-width:0" }, el("div", { class: "nom" }), el("div", { class: "rangc" })),
            el("div", { class: "score num" })),
          el("div", { class: "touches" }, touche(-1, "moins"), touche(1, "plus"), touche(2, "plus"), touche(3, "plus"), touche(5, "plus"),
            el("button", { text: "…", "aria-label": "Autre montant", onclick: () => feuille(x.id) })));
        cartes.set(x.id, c);
      }
      const t = tampon.get(x.id)?.d || 0;
      c.style.setProperty("--c", couleur(x.co));
      c.style.setProperty("--t", texteSur(couleur(x.co)));
      $(".nom", c).textContent = x.nom;
      const [n, s] = ordinal(rangs.get(x.id));
      $(".rangc", c).textContent = `${n}${s} · ${nomCouleur(x.co)}`;
      const sc = $(".score", c); sc.textContent = x.score + t; sc.classList.toggle("envoi", t !== 0);
      zoneCartes.append(c);
    }
    const equipe = id => etat.equipes.find(x => x.id === id);
    histo.replaceChildren(...etat.hist.filter(h => equipe(h.e)).slice(0, 10).map(h => el("li", {},
      el("span", { class: "delta num" + (h.x ? " annule" : ""), text: signe(h.d), style: `color:${h.d > 0 ? "var(--ok)" : "var(--alerte)"}` }),
      el("span", { class: "qui" + (h.x ? " annule" : ""), text: equipe(h.e).nom }),
      el("span", { class: "note num", text: heure(h.ts) }),
      h.x ? el("span", { class: "note", text: "annulé" }) : el("button", { text: "Annuler", onclick: () => annuler(h) }))));
    if (!histo.children.length) histo.append(el("li", { class: "note", text: "Les points ajoutés s'afficheront ici." }));
    if (onglet === "reglages") rendreReglages();
    rendreStatut();
    // Ménage dans l'historique (on garde les 30 dernières actions), fait par une personne connectée
    if (admin && connexion === "ok" && !nettoyage && etat.hist.length > GARDER_HIST + 10) {
      nettoyage = true;
      const maj = {};
      for (const h of etat.hist.slice(GARDER_HIST)) maj["hist/" + h.c] = null;
      salle.modifier(maj).catch(() => {}).finally(() => nettoyage = false);
    }
  }
  let nettoyage = false;
  // Sauvegarde automatique : toutes les 5 minutes au plus, seulement si les scores ont changé
  let sauvegardeEnCours = false;
  function sauvegardeAuto() {
    if (!admin || connexion !== "ok" || sauvegardeEnCours || !etat.equipes.length) return;
    const derniere = etat.sauvegardes[0];
    if (derniere && Date.now() - derniere.ts < INTERVALLE_AUTO) return;
    if (derniere && empreinte(derniere.equipes) === empreinte(etat.equipes)) return;
    sauvegardeEnCours = true;
    const maj = entreesSauvegarde(etat, "auto");
    salle.modifier(maj, maj).catch(() => {}).finally(() => sauvegardeEnCours = false);
  }
  function choisir(o) {
    onglet = o;
    bPoints.setAttribute("aria-selected", o === "points"); bReglages.setAttribute("aria-selected", o === "reglages");
    vuePoints.hidden = o !== "points"; vueReglages.hidden = o !== "reglages";
    rendre();
  }

  /* ----- Actions ----- */
  const scoreDe = id => etat.equipes.find(x => x.id === id)?.score ?? 0;
  function ecrire(maj, optimiste) { salle.modifier(maj, optimiste).catch(e => toast(messageErreur(e))); }
  function points(id, d) {
    const k = cleTemps(), h = { e: id, d, ts: Date.now() };
    ecrire({ [`equipes/${id}/score`]: inc(d), [`hist/${k}`]: h },
      { [`equipes/${id}/score`]: scoreDe(id) + d, [`hist/${k}`]: h });
  }
  function annuler(h) {
    ecrire({ [`equipes/${h.e}/score`]: inc(-h.d), [`hist/${h.c}/x`]: 1 },
      { [`equipes/${h.e}/score`]: scoreDe(h.e) - h.d, [`hist/${h.c}/x`]: 1 });
  }
  function taper(id, d) {
    navigator.vibrate?.(8);
    const t = tampon.get(id) || { d: 0 };
    t.d += d; clearTimeout(t.minuteur);
    t.minuteur = setTimeout(() => { tampon.delete(id); if (t.d) points(id, t.d); else rendre(); }, 600);
    tampon.set(id, t);
    rendre();
  }

  /* ----- Réglages : reconstruits seulement si rien n'est en cours de saisie ----- */
  let signatureReglages = "";
  function rendreReglages() {
    if (vueReglages.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
    const sig = JSON.stringify([etat.titre, etat.equipes.map(x => [x.id, x.nom, x.co]), etat.sauvegardes.map(s => s.k)]);
    if (sig === signatureReglages && vueReglages.childElementCount) return;
    signatureReglages = sig;
    const titre = el("input", { class: "champ", id: "titre", value: etat.titre, maxlength: "60" });
    const prises = new Set(etat.equipes.map(x => x.co));
    let coNouvelle = PALETTE.findIndex((_, i) => !prises.has(i)); if (coNouvelle < 0) coNouvelle = 0;
    const nomNouvelle = el("input", { class: "champ", id: "nouvelle-equipe", placeholder: "Nom de l'équipe", maxlength: "32" });
    const ajouter = () => {
      const nom = nomNouvelle.value.trim();
      if (!nom) { toast("Donne un nom à l'équipe."); nomNouvelle.focus(); return; }
      if (etat.equipes.length >= MAX_EQUIPES) { toast(`${MAX_EQUIPES} équipes au maximum.`); return; }
      const id = aleatoire(8), q = { nom, co: coNouvelle, score: 0, ordre: Date.now() };
      nomNouvelle.value = ""; nomNouvelle.blur(); signatureReglages = "";
      ecrire({ [`equipes/${id}`]: q }, { [`equipes/${id}`]: q });
    };
    nomNouvelle.addEventListener("keydown", e => { if (e.key === "Enter") ajouter(); });

    // Remise à zéro : exige le mot de passe admin, vérifié par Firebase et jamais mémorisé
    const reset = el("div", { class: "reglage" });
    const boutonReset = () => reset.replaceChildren(el("button", { class: "bouton danger", text: "Remettre tous les scores à zéro", onclick: () => {
      if (!EMAIL_ADMIN.trim()) { toast("Remise à zéro non configurée : renseigne EMAIL_ADMIN dans index.html (voir LISEZMOI)."); return; }
      const mdp = el("input", { class: "champ", id: "mdp-admin", type: "password", autocomplete: "off", placeholder: "Mot de passe admin" });
      const valider = el("button", { class: "bouton danger", type: "submit", text: "Remettre à zéro" });
      reset.replaceChildren(el("form", { class: "reglage", onsubmit: async e => {
          e.preventDefault();
          if (!mdp.value) { mdp.focus(); return; }
          valider.disabled = true; valider.textContent = "Vérification…";
          try {
            const j = await authentifier(EMAIL_ADMIN.trim(), mdp.value);
            const maj = { hist: null, ...entreesSauvegarde(etat, "remise") }; // copie des scores dans la même écriture
            for (const x of etat.equipes) maj[`equipes/${x.id}/score`] = 0;
            await salle.modifier(maj, null, j.idToken);
            toast("Scores remis à zéro.");
            boutonReset();
          } catch (err) {
            toast(err.status !== undefined ? messageErreur(err)
              : /INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(err.message) ? "Mot de passe admin incorrect." : messageConnexion(err.message));
            valider.disabled = false; valider.textContent = "Remettre à zéro";
            mdp.value = ""; mdp.focus();
          }
        } },
        el("p", { class: "note", text: "Tous les scores repartent de 0 et l'historique est effacé. Une sauvegarde est faite juste avant. Entre le mot de passe admin pour confirmer." }),
        el("label", { class: "etiquette", for: "mdp-admin", text: "Mot de passe admin" }), mdp,
        el("div", { class: "rangee" }, valider, el("button", { class: "bouton", type: "button", text: "Annuler", onclick: boutonReset }))));
      mdp.focus();
    } }));
    boutonReset();

    vueReglages.replaceChildren(
      el("div", { class: "bloc" },
        el("label", { class: "etiquette", for: "titre", text: "Titre affiché sur l'écran" }), titre,
        el("button", { class: "bouton", text: "Enregistrer le titre", onclick: () => {
          const t = titre.value.trim().slice(0, 60);
          titre.blur(); signatureReglages = "";
          if (t && t !== etat.titre) ecrire({ titre: t }, { titre: t });
        } })),
      el("div", { class: "bloc" },
        el("label", { class: "etiquette", for: "nouvelle-equipe", text: "Ajouter une équipe" }), nomNouvelle,
        selecteur(coNouvelle, i => coNouvelle = i),
        el("button", { class: "bouton principal", text: "Ajouter l'équipe", onclick: ajouter })),
      el("span", { class: "etiquette", text: `Équipes (${etat.equipes.length})` }),
      ...etat.equipes.map(ligneEquipe),
      blocSauvegardes(),
      el("div", { class: "bloc" }, el("span", { class: "etiquette", text: "Partie" }), reset,
        el("p", { class: "note", text: "Adresse de l'écran (à ouvrir sur l'ordinateur d'affichage) :" }),
        el("div", { class: "lien", text: urlVue(code, "ecran") }),
        el("button", { class: "bouton", text: "Changer de salle", onclick: () => location.href = location.pathname })),
      el("div", { class: "bloc" }, el("span", { class: "etiquette", text: "Compte" }),
        el("p", { class: "note", text: EMAIL_ARBITRE.trim() ? "Connecté en arbitre." : "Connecté : " + (session()?.email || "?") }),
        el("button", { class: "bouton", text: "Se déconnecter", onclick: () => { deconnecter(); majMode(); } })));
  }
  /* ----- Sauvegardes : liste, sauvegarde manuelle, restauration (mot de passe admin) ----- */
  function blocSauvegardes() {
    const liste = el("ul", { class: "sauvegardes" }, ...etat.sauvegardes.slice(0, 10).map(ligneSauvegarde));
    if (!etat.sauvegardes.length) liste.append(el("li", { class: "note", text: "Aucune sauvegarde pour l'instant. La première est faite automatiquement dans les 5 minutes qui suivent un changement de score." }));
    const reste = etat.sauvegardes.length - 10;
    return el("div", { class: "bloc" },
      el("span", { class: "etiquette", text: "Sauvegardes" }),
      el("p", { class: "note", text: "Copie automatique des scores toutes les 5 minutes s'ils ont changé (quand un téléphone arbitre est ouvert), et juste avant chaque remise à zéro, suppression d'équipe ou restauration." }),
      el("button", { class: "bouton", type: "button", text: "Sauvegarder maintenant", onclick: () => {
        if (!etat.equipes.length) { toast("Aucune équipe à sauvegarder."); return; }
        const maj = entreesSauvegarde(etat, "manuelle");
        signatureReglages = "";
        salle.modifier(maj, maj).then(() => toast("Scores sauvegardés.")).catch(e => toast(messageErreur(e)));
      } }),
      liste,
      reste > 0 ? el("p", { class: "note", text: `+ ${reste} sauvegarde${reste > 1 ? "s" : ""} plus ancienne${reste > 1 ? "s" : ""}, gardée${reste > 1 ? "s" : ""} dans la base.` }) : null);
  }
  function ligneSauvegarde(s) {
    const zone = el("div");
    const ouvrir = () => {
      if (!EMAIL_ADMIN.trim()) { toast("Restauration non configurée : renseigne EMAIL_ADMIN dans index.html (voir LISEZMOI)."); return; }
      const mdp = el("input", { class: "champ", id: "mdp-restaurer", type: "password", autocomplete: "off", placeholder: "Mot de passe admin" });
      const valider = el("button", { class: "bouton danger", type: "submit", text: "Restaurer" });
      zone.replaceChildren(el("form", { class: "reglage", onsubmit: async e => {
          e.preventDefault();
          if (!mdp.value) { mdp.focus(); return; }
          valider.disabled = true; valider.textContent = "Vérification…";
          try {
            const j = await authentifier(EMAIL_ADMIN.trim(), mdp.value);
            const equipes = {};
            for (const q of s.equipes) equipes[q.id] = { nom: q.nom, co: q.co, score: q.score, ordre: q.ordre };
            // L'état actuel est sauvegardé d'abord : une restauration se rattrape elle aussi
            const maj = { ...entreesSauvegarde(etat, "restauration"), titre: s.titre, equipes, hist: null };
            delete maj["sauvegardes/" + s.k];
            await salle.modifier(maj, null, j.idToken);
            mdp.blur(); zone.replaceChildren(); // ferme le formulaire pour que la liste se redessine
            signatureReglages = "";
            rendre();
            toast(`Scores restaurés (${dateSauvegarde(s.ts)}).`);
          } catch (err) {
            toast(err.status !== undefined ? messageErreur(err)
              : /INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(err.message) ? "Mot de passe admin incorrect." : messageConnexion(err.message));
            valider.disabled = false; valider.textContent = "Restaurer";
            mdp.value = ""; mdp.focus();
          }
        } },
        el("p", { class: "note", text: "Les scores et les équipes reviennent à cet état. L'historique est effacé, et l'état actuel est sauvegardé avant." }),
        el("label", { class: "etiquette", for: "mdp-restaurer", text: "Mot de passe admin" }), mdp,
        el("div", { class: "rangee" }, valider, el("button", { class: "bouton", type: "button", text: "Annuler", onclick: () => zone.replaceChildren() }))));
      mdp.focus();
    };
    return el("li", { class: "sauvegarde" },
      el("div", { class: "sauvegarde-haut" },
        el("div", { style: "min-width:0" },
          el("strong", { class: "num", text: dateSauvegarde(s.ts) }),
          el("span", { class: "note", text: " · " + RAISONS[s.raison] })),
        el("button", { class: "bouton", type: "button", text: "Restaurer", onclick: ouvrir })),
      el("p", { class: "note resume", text: resumeSauvegarde(s) }),
      zone);
  }
  // 10 couleurs prêtes + une couleur libre (code HEX ou sélecteur du téléphone)
  function selecteur(actuel, surChoix) {
    const boite = el("div", { class: "couleurs", role: "group", "aria-label": "Couleur" });
    const pastilles = PALETTE.map((c, i) => el("button", { type: "button", style: `--c:${c}`, "aria-label": NOMS_COULEURS[i], "aria-pressed": i === actuel, onclick: () => choisirCo(i) }));
    const hexActuel = estHex(actuel) ? actuel.toLowerCase() : "";
    const nuancier = el("input", { type: "color", class: "nuancier", "aria-label": "Choisir une couleur", value: hexActuel || couleur(actuel) });
    const champHex = el("input", { class: "champ hex", "aria-label": "Code couleur HEX", placeholder: "#RRGGBB", maxlength: "7", autocapitalize: "off", spellcheck: "false", value: hexActuel.toUpperCase() });
    function choisirCo(co) {
      pastilles.forEach((b, j) => b.setAttribute("aria-pressed", j === co));
      champHex.classList.toggle("actif", estHex(co));
      if (estHex(co)) { champHex.value = co.toUpperCase(); nuancier.value = co; } else champHex.value = "";
      surChoix(co);
    }
    nuancier.addEventListener("change", () => choisirCo(nuancier.value.toLowerCase()));
    champHex.addEventListener("change", () => {
      if (!champHex.value.trim()) return;
      const h = lireHex(champHex.value);
      if (!h) { toast("Code couleur invalide : utilise le format #RRGGBB, par exemple #1E90FF."); return; }
      choisirCo(h);
    });
    champHex.addEventListener("keydown", e => { if (e.key === "Enter") champHex.blur(); });
    champHex.classList.toggle("actif", !!hexActuel);
    boite.append(...pastilles, el("span", { class: "hex-zone" }, nuancier, champHex));
    return boite;
  }
  function ligneEquipe(x) {
    const nom = el("input", { class: "champ", value: x.nom, maxlength: "32", "aria-label": "Nom de l'équipe" });
    nom.addEventListener("change", () => {
      const n = nom.value.trim().slice(0, 32);
      signatureReglages = "";
      if (n && n !== x.nom) ecrire({ [`equipes/${x.id}/nom`]: n }, { [`equipes/${x.id}/nom`]: n });
    });
    nom.addEventListener("keydown", e => { if (e.key === "Enter") nom.blur(); });
    const zone = el("div", { class: "confirm" });
    const boutonSuppr = () => zone.replaceChildren(el("button", { class: "bouton danger", text: "Supprimer", onclick: () =>
      zone.replaceChildren(el("span", { text: `Supprimer « ${x.nom} » et son score ? Une sauvegarde est faite juste avant.` }),
        el("button", { class: "bouton danger", text: "Oui, supprimer", onclick: () => {
          const maj = { ...entreesSauvegarde(etat, "suppression"), [`equipes/${x.id}`]: null };
          for (const h of etat.hist) if (h.e === x.id) maj["hist/" + h.c] = null;
          signatureReglages = "";
          ecrire(maj, maj);
        } }),
        el("button", { class: "bouton", text: "Non", onclick: boutonSuppr })) }));
    boutonSuppr();
    return el("div", { class: "equipe-edit" },
      el("div", { class: "ligne1" }, nom),
      selecteur(x.co, i => { signatureReglages = ""; ecrire({ [`equipes/${x.id}/co`]: i }, { [`equipes/${x.id}/co`]: i }); }),
      zone);
  }

  /* ----- Montant libre ----- */
  function feuille(id) {
    const x = etat.equipes.find(q => q.id === id); if (!x) return;
    const champ = el("input", { class: "champ num", id: "montant", type: "number", inputmode: "numeric", min: "1", step: "1", placeholder: "0" });
    const fermer = () => fond.remove();
    const valider = s => {
      const n = Math.round(Math.abs(Number(champ.value)));
      if (!n || n > 100000) { toast("Entre un nombre de points entre 1 et 100 000."); champ.focus(); return; }
      points(id, s * n); fermer();
    };
    const fond = el("div", { class: "feuille-fond", onclick: e => { if (e.target === fond) fermer(); } },
      el("div", { class: "feuille", role: "dialog", "aria-label": "Autre montant" },
        el("h2", { text: x.nom }), el("label", { class: "etiquette", for: "montant", text: "Nombre de points" }), champ,
        el("div", { class: "rangee" },
          el("button", { class: "bouton danger", text: "Retirer", onclick: () => valider(-1) }),
          el("button", { class: "bouton principal", text: "Ajouter", onclick: () => valider(1) })),
        el("button", { class: "bouton", text: "Fermer", onclick: fermer })));
    document.body.append(fond);
    champ.focus();
  }

  const salle = creerSalle(code, () => rendre(), s => { connexion = s; rendreStatut(); });
  choisir("points");
  majMode();
  setInterval(rendreStatut, 10000);
  setInterval(sauvegardeAuto, 60000);
  salle.connecter();
}

/* ---------- Routage ---------- */
const salleDemandee = normCode(params.get("salle"));
const vueDemandee = params.get("vue");
if (BASE && salleDemandee.length === 16 && vueDemandee === "ecran") lancerEcran(salleDemandee);
else if (BASE && salleDemandee.length === 16 && vueDemandee === "telecommande") lancerTele(salleDemandee);
else lancerAccueil();
</script>
